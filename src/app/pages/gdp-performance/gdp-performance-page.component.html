<section aria-labelledby="gdp-performance-title">
  <header>
    <h1 id="gdp-performance-title">GDP Performance</h1>
  </header>

  <table>
    <caption>
      GDP performance by country
    </caption>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Country Code</th>
        <th scope="col">Year</th>
        <th scope="col">Population</th>
        <th scope="col">GDP</th>
      </tr>
    </thead>
    <tbody>
      @for (gdp of gdpPerformances(); track gdp.countryId) {
        <tr>
          <th scope="row">{{ gdp.name }}</th>
          <td>{{ gdp.countryCode3 }}</td>
          <td>{{ gdp.year }}</td>
          <td>{{ gdp.population }}</td>
          <td>{{ gdp.gdp }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
